# Nginx 설정 파일 (블로그 안정성 개선)
# 이 파일을 /usr/local/etc/nginx/servers/sgtcho-blog.conf로 복사하여 사용

upstream blog_backend {
    server 127.0.0.1:8001 fail_timeout=5s max_fails=3;
    keepalive 32;
}

upstream tech_jobs_backend {
    server 127.0.0.1:3000 fail_timeout=5s max_fails=3;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;
    
    # 클라이언트 바디 크기 제한
    client_max_body_size 10M;
    
    # 버퍼 크기 최적화
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # 타임아웃 설정
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Gzip 압축
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    
    # 정적 파일 캐싱
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|json)$ {
        root /Users/minjaecho/Sites/sgtcho-blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # 큰 이미지 파일을 위한 설정
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }
    
    # 대용량 미디어 파일
    location ~* \.(mp4|webm|mp3|ogg)$ {
        root /Users/minjaecho/Sites/sgtcho-blog;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 스트리밍을 위한 설정
        mp4;
        mp4_buffer_size 1M;
        mp4_max_buffer_size 5M;
    }
    
    # Tech Jobs 라우팅
    location /tech-jobs/ {
        proxy_pass http://tech_jobs_backend/;
        proxy_http_version 1.1;
        
        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep-alive 설정
        proxy_set_header Connection "";
        
        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Tech Jobs 리다이렉트
    location = /tech-jobs {
        return 301 /tech-jobs/;
    }
    
    # 프록시 설정
    location / {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        
        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep-alive 설정
        proxy_set_header Connection "";
        
        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 에러 처리
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # 에러 페이지
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/var/www;
    }
    
    # 헬스 체크 엔드포인트
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}