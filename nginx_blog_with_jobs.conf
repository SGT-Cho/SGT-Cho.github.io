# Nginx 설정 파일 (블로그 + Job Site 통합)
# 이 파일을 /usr/local/etc/nginx/servers/sgtcho-blog.conf로 복사하여 사용

upstream blog_backend {
    server blog:8001 fail_timeout=5s max_fails=3;
    keepalive 32;
}

upstream job_site_backend {
    server job-api:5001 fail_timeout=5s max_fails=3;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;
    
    # 클라이언트 바디 크기 제한
    client_max_body_size 10M;
    
    # 버퍼 크기 최적화
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # 타임아웃 설정
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Gzip 압축
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    
    # Job Site 설정
    # /jobs를 /jobs/로 리다이렉트
    location = /jobs {
        return 301 /jobs/;
    }
    
    # /jobs 경로 - React App
    location /jobs/ {
        alias /var/www/blog/jobs/;
        
        # manifest.json과 같은 정적 파일 처리
        location ~ \.(json|txt|xml)$ {
            add_header Cache-Control "no-cache";
        }
        
        # 정적 파일 캐싱
        location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        
        # React Router 처리
        try_files $uri $uri/ /jobs/index.html;
    }
    
    # /jobs/api 경로 - API Proxy
    location /jobs/api/ {
        proxy_pass http://job_site_backend/api/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
    
    # 블로그 정적 파일 캐싱 (/jobs/ 경로 제외)
    location ~* ^(?!/jobs/).*\.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|json)$ {
        root /var/www/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        try_files $uri $uri/ =404;
    }
    
    # 대용량 미디어 파일
    location ~* \.(mp4|webm|mp3|ogg)$ {
        root /var/www/blog;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        mp4;
        mp4_buffer_size 1M;
        mp4_max_buffer_size 5M;
    }
    
    # 블로그 프록시 설정
    location / {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
    
    # 에러 페이지
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/local/var/www;
    }
    
    # 헬스 체크 엔드포인트
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /jobs/health {
        proxy_pass http://job_site_backend/api/health;
        access_log off;
    }
}