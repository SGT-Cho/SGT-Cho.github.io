  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-more {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
    }
    
    /* Card height consistency improvements */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      padding: 2rem 1rem;
      align-items: stretch;
    }
    
    /* Ensure all cards have equal height */
    .project-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
      position: relative;
      background: var(--bg-secondary);
      border-radius: 0.5rem;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .project-card > a {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }
    
    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .project-card h3 {
      margin: 1rem 1rem 0.5rem;
      font-size: 1.2rem;
      line-height: 1.4;
      min-height: 2.8em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 600;
    }
    
    .project-card .project-tags {
      padding: 0 1rem;
      margin-bottom: 0.5rem;
      min-height: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    
    .project-card .project-tags span {
      background: var(--bg-primary);
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
    }
    
    .project-card > a > p:last-of-type {
      padding: 0 1rem;
      margin-bottom: 1rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    
    .post-card-link {
      margin: 1rem;
      margin-top: auto;
      align-self: flex-start;
      color: var(--accent);
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .project-card:hover .post-card-link {
      color: var(--accent-hover);
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .posts-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .project-card {
        min-height: auto;
      }
    }
  </style>

     </span>
     <span>
     </span>
     <span>
     </span>
    </div>
   </nav>

  <main>
   <section class="intro">
    <h1>Review</h1>
    <p class="tagline">In-depth analysis and insights on AI tools, technologies, and innovations</p>
   </section>
   
   <div id="loading-initial" class="loading-container" style="text-align: center; padding: 2rem;">
    <div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid #333; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    <p>게시물을 불러오는 중...</p>
   </div>
   
   <div id="posts-container" class="posts-grid">
    <!-- 게시물이 여기에 동적으로 로드됩니다 -->
   </div>
   
   <div id="debug-info" style="display: none; text-align: center; padding: 1rem; color: #999; font-size: 0.8rem;">
    <p>총 게시물: <span id="total-posts">0</span>, 로드된 게시물: <span id="loaded-posts">0</span></p>
   </div>

  <!-- Search Modal -->

  <!-- Scripts -->
  <script src="/js/main.js">
  </script>
  <script>
   document.addEventListener('DOMContentLoaded', function() {
    console.log('리뷰 페이지 로드됨');
    
    // 전역 변수
    let allPosts = [];
    let currentIndex = 0;
    const postsPerPage = 9;
    let isLoading = false;
    
    // DOM 요소
    const postsContainer = document.getElementById('posts-container');
    const loadingInitial = document.getElementById('loading-initial');
    const debugInfo = document.getElementById('debug-info');
    const totalPostsElement = document.getElementById('total-posts');
    const loadedPostsElement = document.getElementById('loaded-posts');
    
    // posts.json 로드
    fetch('/posts.json')
      .then(response => response.json())
      .then(posts => {
        console.log('posts.json 로드 완료, 총 게시물 수:', posts.length);
        
        // 리뷰 게시물만 필터링
        allPosts = posts.filter(post => post.url.includes('/review/') && !post.url.includes('index.html') && !post.url.includes('/md/'));
        console.log('필터링된 리뷰 게시물 수:', allPosts.length);
        
        // 최신 순으로 정렬
        allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        // 초기 로딩 숨기기
        loadingInitial.style.display = 'none';
        
        // 디버그 정보 표시
        totalPostsElement.textContent = allPosts.length;
        loadedPostsElement.textContent = 0;
        debugInfo.style.display = 'block';
        
        // 첫 번째 배치 로드
        loadMorePosts();
        
        // 스크롤 이벤트 리스너
        window.addEventListener('scroll', handleScroll);
        
        // 초기 화면이 가득 차지 않으면 추가 로드
        setTimeout(() => {
          const scrollHeight = document.documentElement.scrollHeight;
          const clientHeight = window.innerHeight;
          if (scrollHeight <= clientHeight + 100) {
            console.log('초기 화면 높이 부족 - 추가 로드');
            loadMorePosts();
          }
        }, 1000);
      })
      .catch(error => {
        console.error('Error loading posts:', error);
        loadingInitial.innerHTML = '<p>게시물을 불러오는 중 오류가 발생했습니다.</p>';
      });
      
    // 포스트 렌더링
    function renderPost(post) {
      const postDate = new Date(post.date);
      const formattedDate = postDate.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      
      const thumbnailSrc = post.teaser || '/assets/images/empty.png';
      const shortTitle = post.title.split('|')[0].trim();
      const description = post.excerpt || shortTitle;
      
      const postCard = document.createElement('div');
      postCard.className = 'project-card';
      postCard.innerHTML = `
        <a href="${post.url}">
          <img src="${thumbnailSrc}" alt="${shortTitle}" loading="lazy" 
               onerror="this.onerror=null; this.src='/assets/images/empty.png';">
          <h3>${shortTitle}</h3>
          <p class="project-tags">
            <span>${formattedDate}</span> 
            <span>${post.readtime || '5'} min read</span>
          </p>
          <p>${description}</p>
          <span class="post-card-link">Read more →</span>
        </a>
      `;
      
      return postCard;
    }
    
    // 더 많은 포스트 로드
    function loadMorePosts() {
      if (isLoading || currentIndex >= allPosts.length) return;
      
      isLoading = true;
      
      // 로딩 인디케이터 표시
      const loadingMore = document.createElement('div');
      loadingMore.className = 'loading-more';
      loadingMore.innerHTML = '<div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid #333; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div><p>더 많은 포스트 불러오는 중...</p>';
      postsContainer.appendChild(loadingMore);
      
      setTimeout(() => {
        const endIndex = Math.min(currentIndex + postsPerPage, allPosts.length);
        const postsToAdd = allPosts.slice(currentIndex, endIndex);
        
        // 로딩 인디케이터 제거
        loadingMore.remove();
        
        // 포스트 추가
        postsToAdd.forEach(post => {
          postsContainer.appendChild(renderPost(post));
        });
        
        currentIndex = endIndex;
        loadedPostsElement.textContent = currentIndex;
        
        isLoading = false;
        
        console.log(`${postsToAdd.length}개 포스트 추가됨, 총 ${currentIndex}/${allPosts.length}`);
        
        // 모든 포스트를 로드했으면 스크롤 이벤트 제거
        if (currentIndex >= allPosts.length) {
          window.removeEventListener('scroll', handleScroll);
          console.log('모든 포스트 로드 완료');
        }
      }, 500);
    }
    
    // 스크롤 핸들러
    function handleScroll() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight;
      const clientHeight = window.innerHeight;
      
      // 페이지 하단에서 300px 이내면 더 로드
      if (scrollTop + clientHeight >= scrollHeight - 300 && !isLoading) {
        console.log('스크롤 감지 - 추가 로드 시작');
        loadMorePosts();
      }
    }
  });
  </script>
