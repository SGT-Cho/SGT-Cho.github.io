# Job Site Integration for sgtcho-blog
# This configuration should be included in the main nginx_blog.conf

# Job Site API Backend
upstream job_site_backend {
    server 127.0.0.1:5001 fail_timeout=5s max_fails=3;
    keepalive 32;
}

# /jobs 경로 설정 - React App
location /jobs {
    alias /Users/minjaecho/Sites/sgtcho-blog/jobs;
    try_files $uri $uri/ /jobs/index.html;
    
    # React Router 지원
    location ~ ^/jobs/(.*)$ {
        try_files /jobs/$1 /jobs/index.html;
    }
}

# /jobs/api 경로 설정 - API Proxy
location /jobs/api/ {
    proxy_pass http://job_site_backend/api/;
    proxy_http_version 1.1;
    
    # 헤더 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Keep-alive 설정
    proxy_set_header Connection "";
    
    # 타임아웃 설정
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # CORS 헤더
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # OPTIONS 요청 처리
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}