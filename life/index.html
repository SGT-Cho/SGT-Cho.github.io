  <!-- Stylesheets -->
  <link href="/css/style.css?v=20250702" rel="stylesheet"/>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Card height consistency improvements */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      padding: 2rem 1rem;
      align-items: stretch;
    }
    
    /* Ensure all cards have equal height */
    .project-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 420px;
      position: relative;
      background: var(--bg-secondary);
      border-radius: 0.5rem;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .project-card > a {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }
    
    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .project-card h3 {
      margin: 1rem 1rem 0.5rem;
      font-size: 1.2rem;
      line-height: 1.4;
      min-height: 2.8em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 600;
    }
    
    .project-card .project-tags {
      padding: 0 1rem;
      margin-bottom: 0.5rem;
      min-height: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    
    .project-card .project-tags span {
      background: var(--bg-primary);
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
    }
    
    .project-card > a > p:last-of-type {
      padding: 0 1rem;
      margin-bottom: 1rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      color: var(--text-secondary);
    }
    
    .post-card-link {
      margin: 1rem;
      margin-top: auto;
      align-self: flex-start;
      color: var(--accent);
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .project-card:hover .post-card-link {
      color: var(--accent-hover);
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .posts-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .project-card {
        min-height: auto;
      }
    }
  </style>
  <!-- Favicon -->
  <link href="/assets/images/minjae.png" rel="icon" type="image/x-icon"/>
  <!-- Web App Manifest -->
  <link href="/manifest.json" rel="manifest"/>
 </head>
 <body>
  <header>
   <!-- Header/Navigation -->
   <nav>
    <a class="nav-logo" href="/">
     <img alt="Minjae Cho" src="/assets/images/minjae.png"/>
     <span>
      Minjae Cho
     </span>
    </a>
    <div class="nav-links">
     <a class="active" href="/life/">
      Life
     </a>
     <a href="/review/">
      Review
     </a>
     <a href="/portfolio/">
      Portfolio
     </a>
     <a href="/archive/">
      Archive
     </a>
     <a href="/about/">
      About
     </a>
    </div>
    <div aria-label="메뉴 열기" class="hamburger" tabindex="0">
     <span>
     </span>
     <span>
     </span>
     <span>
     </span>
    </div>
   </nav>
  </header>
  <main>
   <section class="intro">
    <h1>Life</h1>
    <p class="tagline">Personal stories and experiences from my journey as an AI Engineer</p>
   </section>
   
   <div id="loading-initial" class="loading-container" style="text-align: center; padding: 2rem;">
    <div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid #333; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    <p>게시물을 불러오는 중...</p>
   </div>
   
   <div id="posts-container" class="posts-grid">
    <!-- 게시물이 여기에 동적으로 로드됩니다 -->
   </div>
   
   <div id="debug-info" style="display: none; text-align: center; padding: 1rem; color: #999; font-size: 0.8rem;">
    <p>총 게시물: <span id="total-posts">0</span>, 로드된 게시물: <span id="loaded-posts">0</span></p>
   </div>
  </main>
  <!-- Search Modal -->
  <div class="search-modal">
   <div class="search-container">
    <div class="search-form">
     <input class="search-input" placeholder="Search posts, topics, or tags..." type="text"/>
     <button class="search-close">
      ×
     </button>
    </div>
    <div class="search-results">
     <!-- Results will be populated here -->
    </div>
   </div>
  </div>
  <!-- Footer -->
  <footer>
   <div class="container">
    <p>
     © 2025 Minjae Cho · Built with passion and code
    </p>
   </div>
  </footer>
  <!-- Scripts -->
  <script src="/js/main.js">
  </script>
  <script>
   document.addEventListener('DOMContentLoaded', function() {
    console.log('라이프 페이지 로드됨');
    
    // 실제 게시물 데이터를 posts.json에서 로드
    fetch('/posts.json')
      .then(response => response.json())
      .then(posts => {
        console.log('posts.json 로드 완료, 총 게시물 수:', posts.length);
        
        // Life 게시물만 필터링
        const lifePosts = posts.filter(post => post.url.includes('/life/') && !post.url.includes('index.html') && !post.url.includes('/md/'));
        console.log('필터링된 라이프 게시물 수:', lifePosts.length);
        
        // 최신 순으로 정렬
        lifePosts.sort((a, b) => new Date(b.date) - new Date(a.date));
        console.log('정렬 완료, 첫 번째 게시물:', lifePosts[0]?.title);
        
        // 모든 게시물을 한 번에 로드
        setupAllPosts(lifePosts);
      })
      .catch(error => {
        console.error('Error loading posts:', error);
        document.getElementById('posts-container').innerHTML = 
          '<p class="text-center" style="grid-column: 1/-1;">게시물을 불러오는 중 오류가 발생했습니다.</p>';
      });
      
    // 모든 게시물을 한 번에 로드하는 함수
    function setupAllPosts(allPosts) {
      const postsContainer = document.getElementById('posts-container');
      const loadingInitial = document.getElementById('loading-initial');
      const debugInfo = document.getElementById('debug-info');
      const totalPostsElement = document.getElementById('total-posts');
      const loadedPostsElement = document.getElementById('loaded-posts');
      
      // 초기 로딩 표시 제거
      loadingInitial.style.display = 'none';
      
      // 디버깅 정보 표시
      totalPostsElement.textContent = allPosts.length;
      loadedPostsElement.textContent = allPosts.length;
      debugInfo.style.display = 'block';
      
      // 디버그를 위한 이미지 로딩 실패 카운터
      let failedImages = 0;
      
      // 모든 게시물 HTML 생성
      let postsHTML = '';
      
      allPosts.forEach((post, index) => {
        console.log(`게시물 ${index + 1} 처리 중:`, post.title);
        
        // 게시물 날짜 형식화
        const postDate = new Date(post.date);
        const formattedDate = postDate.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
        
        // posts.json에서 지정된 썸네일 경로 사용
        const thumbnailSrc = post.teaser || '/assets/images/empty.png';
        
        // 게시물 제목에서 | 이전 부분만 표시
        const shortTitle = post.title.split('|')[0].trim();
        
        // 설명 텍스트 (제목과 다르게 표시하기 위해 첫 문장이나 요약 사용)
        const description = post.excerpt || shortTitle;
        
        postsHTML += `
          <div class="project-card">
            <a href="${post.url}">
              <img src="${thumbnailSrc}" alt="${shortTitle}" loading="lazy" onerror="this.onerror=null; this.src='/assets/images/empty.png'; console.log('이미지 로드 실패: ${thumbnailSrc}');">
              <h3>${shortTitle}</h3>
              <p class="project-tags">
                <span>${formattedDate}</span>
                <span>${post.readtime || '5'} min read</span>
              </p>
              <p>${description}</p>
              <span class="post-card-link">Read more →</span>
            </a>
          </div>
        `;
      });
      
      // HTML 추가
      postsContainer.innerHTML = postsHTML;
      console.log('모든 게시물 로드 완료');
      
      // 이미지 로딩 실패 시 대체 이미지 사용
      document.querySelectorAll('#posts-container img').forEach(img => {
        img.addEventListener('error', function() {
          console.log(`이미지 로드 실패: ${this.src}`);
          this.src = '/assets/images/empty.png';
          failedImages++;
          console.log(`실패한 이미지 수: ${failedImages}`);
        });
      });
    }
  });
  </script>
 </body>
</html>
