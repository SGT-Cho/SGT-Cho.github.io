# Nginx 리버스 프록시 설정 예시 (선택사항)
# /etc/nginx/sites-available/sgtcho-blog

server {
    listen 80;
    server_name sgtcho.com;

    # 정적 파일 직접 서빙 (성능 향상)
    location /assets/ {
        alias /Users/minjaecho/Sites/sgtcho-blog/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        alias /Users/minjaecho/Sites/sgtcho-blog/css/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /js/ {
        alias /Users/minjaecho/Sites/sgtcho-blog/js/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 및 동적 콘텐츠는 Gunicorn으로 프록시
    location / {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 지원 (필요시)
    location /ws {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}